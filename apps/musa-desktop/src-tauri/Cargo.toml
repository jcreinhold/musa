[package]
name = "musa-desktop"
description = "Tauri shell over musa-project"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "musa_desktop"
path = "src/lib.rs"

[[bin]]
name = "musa-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
musa-project = { path = "../../../crates/musa-project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
