[package]
description = "Tauri shell over musa-project"
edition.workspace = true
license.workspace = true
name = "musa-desktop"
repository.workspace = true
version.workspace = true

[lib]
name = "musa_desktop"
path = "src/lib.rs"

# The binary is one call into the library, so it declares no test harness:
# cargo would otherwise build and link a second copy of the whole crate to run
# zero tests. What the app does is tested through `musa_desktop`.
[[bin]]
name = "musa-desktop"
path = "src/main.rs"
test = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
musa-project = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
ts-rs = "12"

[dev-dependencies]
# The review fixtures are composed from the real take, and a take is captured
# MIDI: the generator builds one the way the capture path does. A dev
# dependency, because the shell itself never touches the device boundary.
musa-playback = { workspace = true }
musa-syntax = { workspace = true }
tempfile = "3"
