# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# The lint level for unmaintained crates. Scoped to "workspace" so we are
# alerted when *we* add an unmaintained dependency, but transitive ones from
# upstream crates don't drown the signal. Switch to "all" if you want to audit
# the full graph manually.
unmaintained = "workspace"
# The lint level for crates that have been yanked from their source registry
yanked = "warn"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
ignore = []

[licenses]
# List of explicitly allowed licenses.
# Permissive only — compatible with this workspace's `MIT OR Apache-2.0`
# dual license without imposing additional obligations on the consuming
# binary. MPL-2.0 is the weakest copyleft we accept (file-level scope,
# does not relicense linked code). Strong copyleft (GPL/LGPL/AGPL/SSPL/
# CDDL/EPL/EUPL/CPAL) is intentionally omitted — anything not in `allow`
# is rejected by default (newer cargo-deny removed `licenses.deny`).
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
# Don't warn about entries in `allow` that no crate currently uses — the list
# is a forward-looking policy, not a snapshot of the current graph.
unused-allowed-license = "allow"
# The confidence threshold for detecting a license from a license text.
confidence-threshold = 0.95

[licenses.private]
# If true, ignores workspace crates that aren't published, or are only
# published to private registries
ignore = false

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
highlight = "all"

# List of crates that are allowed. Use with care!
allow = []

# List of crates to deny
# Pin the lean-rs crate family to a single semver-compatible line. lean-rs is
# 0.x, so 0.2.x and 0.3.x are incompatible: if an old transitive pin (e.g. a
# not-yet-upgraded lean-semantic-search) drags a pre-0.3 copy into the graph
# alongside the 0.3 crates this workspace builds against, their shared types
# (e.g. lean_toolchain::LeanBuiltCapability) stop unifying and surface as a
# confusing deep E0308. Denying anything below the floor makes that partial
# upgrade fail `cargo deny check` loudly instead. Raise the floor in lockstep on
# the next lean-rs major (0.x) bump.
deny = [
  { name = "lean-rs", version = "<0.3" },
  { name = "lean-rs-abi", version = "<0.3" },
  { name = "lean-rs-host", version = "<0.3" },
  { name = "lean-rs-interop-shims", version = "<0.3" },
  { name = "lean-rs-sys", version = "<0.3" },
  { name = "lean-rs-worker-child", version = "<0.3" },
  { name = "lean-rs-worker-parent", version = "<0.3" },
  { name = "lean-rs-worker-protocol", version = "<0.3" },
  { name = "lean-toolchain", version = "<0.3" },
]

# Certain crates/versions that will be skipped when doing duplicate detection.
#
# Every duplicate below is purely transitive: both versions enter the graph
# through crates we do not control (tauri/wry/gtk/webkit2gtk, cpal/midir,
# miette, lsp-types/fluent-uri, schemars) that are already at their latest
# releases, so there is no upgrade on our side that collapses them. Only the
# *older* line of each duplicate is skipped, so a third version appearing is
# still flagged. Re-audit after each tauri/wry major bump and prune entries
# whose duplicate has disappeared.
skip = [
  { name = "base64", version = "0.21.7" },        # swift-rs (tauri-utils)
  { name = "bitflags", version = "1.3.2" },      # fluent-uri/lsp-types, webkit2gtk
  { name = "getrandom", version = "0.3.4" },     # tauri (vs uuid 0.4)
  { name = "hashbrown", version = "0.12.3" },    # indexmap 1.9 (schemars)
  { name = "hashbrown", version = "0.14.5" },    # rowan 0.17
  { name = "heck", version = "0.4.1" },          # glib-macros (gtk)
  { name = "indexmap", version = "1.9.3" },      # schemars 0.8 (tauri)
  { name = "png", version = "0.17.16" },         # tauri-codegen/ico (vs muda 0.18)
  { name = "proc-macro-crate", version = "1.3.1" }, # gtk3-macros
  { name = "proc-macro-crate", version = "2.0.2" }, # glib-macros
  { name = "rustc-hash", version = "1.1.0" },    # rowan 0.17
  { name = "serde_spanned", version = "0.6.9" }, # toml_edit 0.20 (gtk system-deps)
  { name = "syn", version = "1.0.109" },         # proc-macro-error (glib-macros)
  { name = "syn", version = "2.0.119" },         # pre-syn-3 proc macros
  { name = "thiserror", version = "1.0.69" },    # cairo-rs/gtk family
  { name = "thiserror-impl", version = "1.0.69" },
  { name = "toml", version = "0.8.2" },          # system-deps (gtk build)
  { name = "toml", version = "0.9.12" },         # cargo_toml (tauri-build)
  { name = "toml_datetime", version = "0.6.3" }, # toml_edit 0.20
  { name = "toml_datetime", version = "0.7.5" }, # toml 0.9
  { name = "toml_edit", version = "0.19.15" },   # proc-macro-crate 1.3 (gtk3-macros)
  { name = "toml_edit", version = "0.20.2" },    # proc-macro-crate 2.0 (glib-macros)
  { name = "unicode-width", version = "0.1.14" },# miette 7.6
  { name = "windows", version = "0.61.3" },      # tao/wry (vs cpal/midir 0.62)
  { name = "windows-collections", version = "0.2.0" },
  { name = "windows-core", version = "0.61.2" },
  { name = "windows-future", version = "0.2.1" },
  { name = "windows-link", version = "0.1.3" },
  { name = "windows-numerics", version = "0.2.0" },
  { name = "windows-result", version = "0.3.4" },
  { name = "windows-strings", version = "0.4.2" },
  { name = "windows-sys", version = "0.59.0" },   # window-vibrancy, winreg
  { name = "windows-sys", version = "0.60.2" },   # rfd
  { name = "windows-targets", version = "0.52.6" },
  { name = "windows-threading", version = "0.1.0" },
  { name = "windows_x86_64_gnu", version = "0.52.6" },
  { name = "windows_x86_64_msvc", version = "0.52.6" },
  { name = "winnow", version = "0.5.40" },       # toml_edit 0.19/0.20
  { name = "winnow", version = "0.7.15" },       # toml 0.9 (cargo_toml)
]

# Similarly to `skip` allows you to skip certain crates from being checked
skip-tree = []

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []
