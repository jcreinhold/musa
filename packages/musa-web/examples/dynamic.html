<!doctype html>
<!-- EXAMPLE: snippets added after load (prompt 150). The watcher typesets
     arrivals; you never call typeset again. Same serving story as blog.html. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Adding examples on the fly — musa</title>
</head>
<body>
  <main id="host">
    <p>Every snippet below was appended after the page loaded.</p>
  </main>
  <button id="add" type="button">add example</button>

  <script type="module">
    import { typeset } from "../dist/index.js"; // in your app: "@musa/web"

    const PIECES = [
      ['piece "late-1" {\n tempo 1/4 = 72;\n meter 2/4;\n score {\n part oboe {\n voice l {\n | e4/4 d4/4\n }\n }\n }\n}'],
      ['piece "late-2" {\n tempo 1/4 = 100;\n meter 3/8;\n score {\n part flute {\n voice l {\n | g4/8 a4/8 b4/8\n }\n }\n }\n}'],
    ];
    let next = 0;

    window.typesetDone = typeset(document, { watch: true });

    document.getElementById("add").addEventListener("click", () => {
      const source = PIECES[next % PIECES.length];
      next += 1;
      const score = document.createElement("musa-score");
      score.textContent = source[0];
      document.getElementById("host").append(score);
    });
  </script>
</body>
</html>
