<!doctype html>
<!-- EXAMPLE: provenance interaction (prompt 143). Click a note: the callback
     gets the compiler's EventId, every piece of the event lights up (ties
     included), and the source it came from is one toggle away. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Every note knows its event — musa</title>
  <script>
    window.MusaWeb = {
      onEventClick: (id, target, context) => {
        document.getElementById("report").textContent = `event ${id}`;
        // In your app: import { highlight } from "@musa/web"
        import("../dist/index.js").then(({ highlight }) => highlight(id));
      },
    };
  </script>
  <style>
    #report { font-family: ui-monospace, monospace; min-height: 1.5em; }
    musa-score.revealed { font-size: inherit; }
    musa-score.revealed::after { content: ""; display: block; }
  </style>
</head>
<body>
  <main>
    <p id="report">click a note</p>
    <musa-score id="tied">
piece "tied" {
    tempo 1/4 = 72;
    meter 4/4;
    score {
        part violin {
            voice line {
                | a4/2 ~ a4/4 g4/4
                | c5/1
            }
        }
    }
}
    </musa-score>
    <button id="reveal" type="button">reveal source</button>
  </main>

  <script type="module">
    import { typeset } from "../dist/index.js"; // in your app: "@musa/web"
    window.typesetDone = typeset();
    document.getElementById("reveal").addEventListener("click", () => {
      document.getElementById("tied").classList.toggle("revealed");
    });
  </script>
</body>
</html>
