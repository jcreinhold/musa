<!doctype html>
<!-- Dynamic page: snippets appended after load are typeset by the watcher. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>musa-web watch</title>
  </head>
  <body>
    <main id="host"></main>
    <button id="add" type="button">add example</button>
    <script type="module">
      import { typeset } from "/src/index.ts";
      window.typesetDone = typeset(document, { watch: true });
      document.getElementById("add").addEventListener("click", () => {
        const score = document.createElement("musa-score");
        score.id = "appended";
        score.textContent = `
piece "late" {
    tempo 1/4 = 72;
    meter 2/4;
    score {
        part oboe {
            voice line {
                | e4/4 d4/4
            }
        }
    }
}
      `;
        document.getElementById("host").append(score);
        window.appended = true;
      });
    </script>
  </body>
</html>
