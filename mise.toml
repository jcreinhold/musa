# Toolchain for the web wasm artifact (prompt 194), the post-wasm-pack way.
# `mise install` provides wasm-bindgen-cli and wasm-opt; the Rust target is
# `rustup target add wasm32-unknown-unknown`.

[tools]
"ubi:WebAssembly/binaryen" = { version = "version_123", extract_all = "true", bin_path = "bin" }
"ubi:rustwasm/wasm-bindgen" = { version = "0.2.127", extract_all = "true" }
