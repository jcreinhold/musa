[package]
description = "Name resolution, units, compositional model, expansion, and score/performance snapshots"
edition.workspace = true
license.workspace = true
name = "musa-compiler"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
musa-kernel = { workspace = true }
musa-language = { workspace = true }
num-rational = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
slotmap = "1"
thiserror = "2"

[dev-dependencies]
divan = "0.1.21"
insta = "1"
proptest = "1"

[[bench]]
harness = false
name = "pipeline"
