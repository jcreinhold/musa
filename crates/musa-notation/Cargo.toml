[package]
description = "Backend-neutral notation planning and MEI/LilyPond/MusicXML/MIDI export"
edition.workspace = true
license.workspace = true
name = "musa-notation"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
musa-events = { workspace = true }
musa-score = { workspace = true }
musa-syntax = { workspace = true }
num-rational = "0.4"
quick-xml = "0.41"
thiserror = "2"
tracing = "0.1"
# `parallel` (rayon) is for parsing huge files; we only write.
midly = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
insta = "1"
musa-compiler = { workspace = true }
proptest = "1"
