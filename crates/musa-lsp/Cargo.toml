[package]
description = "Language server (LSP) over musa-project and musa-syntax"
edition.workspace = true
license.workspace = true
name = "musa-lsp"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

# The binary is one call into the library (`src/main.rs`), so it declares no
# test harness: cargo would otherwise build and link a second copy of the
# whole crate to run zero tests. Everything the server does is tested through
# the library and `tests/`.
[[bin]]
name = "musa-lsp"
path = "src/main.rs"
test = false

[dependencies]
fluent-uri = "0.1"
lsp-server = "0.10"
lsp-types = "0.97"
musa-dsp = { workspace = true }
musa-project = { workspace = true }
musa-syntax = { workspace = true }
serde_json = "1"
tracing = "0.1"
