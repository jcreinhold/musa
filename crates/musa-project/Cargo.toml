[package]
description = "Project session: documents, revisions, commands, compilation orchestration, and exports"
edition.workspace = true
license.workspace = true
name = "musa-project"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
hound = "3"
musa-audio = { workspace = true }
musa-compiler = { workspace = true }
musa-engine = { workspace = true }
musa-language = { workspace = true }
musa-render = { workspace = true }
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
# `preserve_order` so the wire snapshot keeps the field order `SnapshotWire`
# declares. It travels through `serde_json::Value` on its way out (spans are
# restated there, see `utf16`), and the default map would re-sort every field
# alphabetically — turning a committed fixture into something no one can read
# and every regeneration into a large diff.
serde_json = { version = "1", features = ["preserve_order"] }
text-size = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
