[package]
description = "Project session: documents, revisions, commands, compilation orchestration, and exports"
name = "musa-project"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
hound = "3"
musa-audio = { path = "../musa-audio" }
musa-compiler = { path = "../musa-compiler" }
musa-engine = { path = "../musa-engine" }
musa-language = { path = "../musa-language" }
musa-render = { path = "../musa-render" }
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
text-size = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
