[package]
description = "CPAL output stream, transport, real-time command queues, and MIDI input"
edition.workspace = true
license.workspace = true
name = "musa-playback"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
cpal = "0.18"
midir = "0.11"
# Musical time is rational even where a follower reads it off a wire: a
# song position is an exact number of sixteenths and an MTC frame is an exact
# fraction of a second (constitution.md §3).
musa-dsp = { workspace = true }
musa-score = { workspace = true }
num-rational = "0.4"
rtrb = "0.3.5"
thiserror = "2"
tracing = "0.1"

# CoreMIDI is the only MIDI output macOS has, and it is macOS-only: the rest
# of the crate builds and every live-output law runs without it.
[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"

[dev-dependencies]
musa-compiler = { workspace = true }
rtrb = "0.3.5"
