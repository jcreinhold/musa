# A directory project (roadmap 16): a title the pieces share, and nothing a
# piece needs in order to compile. `pieces/01-opening.musa` opens on its own,
# with or without this file beside it.
[project]
name = "Album"
composer = "musa"
# The running order. It sets an order, not a membership: a piece the folder
# has and this list does not name still appears, after the ones it does.
pieces = ["pieces/01-opening.musa", "pieces/02-waltz.musa"]
